<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gestion — Leady Commerce</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">

  <a class="brand" href="index.html">
    <img src="logo-leady.jpg" alt="Leady Commerce">
  </a>

  <nav>
    <a href="index.html">Voir le site</a>

    <button id="logout" class="outline" type="button">
      Déconnexion
    </button>
  </nav>

</header>


<main class="admin wrap">

  <div class="heading-row">

    <div>
      <div class="kicker">ADMINISTRATION</div>
      <h1>Gestion des chevaux</h1>
    </div>

  </div>


  <div id="admin-message" class="message"></div>


  <section class="admin-layout">


    <!-- AJOUTER UN CHEVAL -->

    <div class="panel">

      <h2>Ajouter un cheval</h2>

      <form id="horse-form">

        <label>
          Nom
          <input
            id="nom"
            type="text"
            required
          >
        </label>


        <div class="two">

          <label>
            Discipline
            <input
              id="discipline"
              type="text"
            >
          </label>


          <label>
            Sexe
            <input
              id="sexe"
              type="text"
            >
          </label>

        </div>


        <div class="two">

          <label>
            Âge
            <input
              id="age"
              type="text"
            >
          </label>


          <label>
            Prix
            <input
              id="prix"
              type="number"
              min="0"
            >
          </label>

        </div>


        <!-- =========================
             SELECTION DE LA PHOTO
        ========================== -->

        <label>
          Photo du cheval

          <input
            id="photo-file"
            type="file"
            accept="image/*"
          >

        </label>


        <!-- APERCU -->

        <div
          id="photo-preview"
          style="margin-top:10px;"
        ></div>


        <!-- DESCRIPTION -->

        <label>

          Description

          <textarea
            id="description"
            rows="6"
          ></textarea>

        </label>


        <!-- VENDU -->

        <label class="check">

          <input
            id="vendu"
            type="checkbox"
          >

          Vendu

        </label>


        <button
          id="add-horse-button"
          class="btn"
          type="submit"
        >
          Ajouter le cheval
        </button>

      </form>

    </div>


    <!-- LISTE DES CHEVAUX -->

    <div class="panel">

      <h2>Chevaux existants</h2>

      <div id="horse-list">
        Chargement...
      </div>

    </div>

  </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="gestion.js?v=4"></script>


</body>
</html>
```
