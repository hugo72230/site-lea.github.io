<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestion — Leady Commerce</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="nav"><a class="brand" href="index.html"><img src="logo-leady.jpg" alt="Leady Commerce"></a><nav><a href="index.html">Voir le site</a><button id="logout" class="outline">Déconnexion</button></nav></header>
<main class="admin wrap">
  <div class="heading-row"><div><div class="kicker">ADMINISTRATION</div><h1>Gestion des chevaux</h1></div></div>
  <div id="admin-message" class="message"></div>
  <section class="admin-layout">
    <div class="panel">
      <h2>Ajouter un cheval</h2>
      <form id="horse-form">
        <label>Nom<input id="nom" required></label>
        <div class="two"><label>Discipline<input id="discipline"></label><label>Sexe<input id="sexe"></label></div>
        <div class="two"><label>Âge<input id="age"></label><label>Prix<input id="prix" type="number" min="0"></label></div>
        <label>Photo (URL)<input id="photo" type="url"></label>
        <label>Description<textarea id="description" rows="6"></textarea></label>
        <label class="check"><input id="vendu" type="checkbox"> Vendu</label>
        <button class="btn" type="submit">Ajouter le cheval</button>
      </form>
    </div>
    <div class="panel">
      <h2>Chevaux existants</h2>
      <div id="horse-list">Chargement...</div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="gestion.js"></script>
</body>
</html>
