
<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Gestion — Leady Commerce</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">

  <a class="brand" href="index.html">
    <img src="logo-leady.jpg" alt="Leady Commerce">
  </a>

  <nav>
    <a href="index.html">Voir le site</a>
    <button id="logout" class="outline">Déconnexion</button>
  </nav>

</header>


<main class="admin wrap">

  <div class="heading-row">

    <div>
      <div class="kicker">ADMINISTRATION</div>
      <h1>Gestion des chevaux</h1>
    </div>

  </div>


  <div id="admin-message" class="message"></div>


  <section class="admin-layout">


    <!-- =========================
         AJOUTER UN CHEVAL
    ========================== -->

    <div class="panel">

      <h2>Ajouter un cheval</h2>

      <form id="horse-form">

        <label>
          Nom
          <input id="nom" required>
        </label>


        <div class="two">

          <label>
            Discipline
            <input id="discipline">
          </label>


          <label>
            Sexe
            <input id="sexe">
          </label>

        </div>


        <div class="two">

          <label>
            Âge
            <input id="age">
          </label>


          <label>
            Prix
            <input id="prix" type="number" min="0">
          </label>

        </div>


        <label>
          Photo (URL)
          <input id="photo" type="url">
        </label>


        <label>
          Description
          <textarea id="description" rows="6"></textarea>
        </label>


        <label class="check">

          <input id="vendu" type="checkbox">

          Vendu

        </label>


        <button class="btn" type="submit">
          Ajouter le cheval
        </button>

      </form>

    </div>



    <!-- =========================
         LISTE DES CHEVAUX
    ========================== -->

    <div class="panel">

      <h2>Chevaux existants</h2>

      <p class="meta">
        Clique sur un cheval pour modifier sa fiche.
      </p>


      <div id="horse-list">
        Chargement...
      </div>

    </div>

  </section>



  <!-- =========================
       MODIFICATION
  ========================== -->

  <section
    id="edit-panel"
    class="panel edit-panel"
    style="display:none;"
  >

    <div class="heading-row">

      <div>

        <div class="kicker">
          MODIFICATION
        </div>

        <h2 id="edit-title">
          Modifier le cheval
        </h2>

      </div>


      <button
        id="cancel-edit"
        class="outline"
        type="button"
      >
        Fermer
      </button>

    </div>



    <form id="edit-form">

      <input
        id="edit-id"
        type="hidden"
      >


      <label>

        Nom

        <input
          id="edit-nom"
          required
        >

      </label>



      <div class="two">

        <label>

          Discipline

          <input
            id="edit-discipline"
          >

        </label>


        <label>

          Sexe

          <input
            id="edit-sexe"
          >

        </label>

      </div>



      <div class="two">

        <label>

          Âge

          <input
            id="edit-age"
          >

        </label>


        <label>

          Prix

          <input
            id="edit-prix"
            type="number"
            min="0"
          >

        </label>

      </div>



      <label>

        Photo (URL)

        <input
          id="edit-photo"
          type="url"
        >

      </label>



      <label>

        Description

        <textarea
          id="edit-description"
          rows="8"
        ></textarea>

      </label>



      <label class="check">

        <input
          id="edit-vendu"
          type="checkbox"
        >

        Vendu

      </label>



      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <button
          class="btn"
          type="submit"
        >
          Enregistrer les modifications
        </button>


        <button
          id="cancel-edit-2"
          class="outline"
          type="button"
        >
          Annuler
        </button>

      </div>

    </form>

  </section>

</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="gestion.js"></script>

</body>

</html>
```
